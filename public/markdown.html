<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Markdown PDF 변환기</title>
    <meta
      name="description"
      content="Markdown 파일을 업로드하면 gotenberg를 통해 PDF로 변환해서 바로 다운로드합니다."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-mode="markdown">
    <div class="page-shell">
      <header class="hero">
        <div class="page-switch" aria-label="변환기 선택">
          <a class="page-link" href="/">PDF 4P 변환</a>
          <a class="page-link is-active" href="/markdown.html">Markdown → PDF</a>
        </div>
        <p class="eyebrow">MARKDOWN TO PDF</p>
        <h1>문서를 업로드하면<br />바로 PDF로 내려받습니다.</h1>
        <p class="hero-copy">
          <code>.md</code> 파일을 올리면 서버가 <code>gotenberg</code>의 Chromium Markdown 변환 엔드포인트로
          전달하고, 인쇄용 스타일이 적용된 PDF를 즉시 생성합니다.
        </p>
      </header>

      <main class="content-grid">
        <section class="upload-card">
          <form id="upload-form" class="upload-form">
            <label id="dropzone" class="dropzone" for="file-input">
              <input id="file-input" name="file" type="file" accept=".md,text/markdown,text/plain" hidden />
              <span class="dropzone-kicker">DROP OR SELECT</span>
              <strong>Markdown 파일 업로드</strong>
              <span class="dropzone-note">
                README, 강의 노트, 기술 문서처럼 일반적인 `.md` 파일을 그대로 올릴 수 있습니다.
              </span>
              <span id="file-name" class="file-name">선택된 파일이 없습니다.</span>
            </label>

            <button id="submit-button" type="submit" class="submit-button">
              PDF 생성 후 다운로드
            </button>
          </form>

          <div id="status" class="status" aria-live="polite"></div>
          <div id="result-actions" class="result-actions" hidden>
            <a id="open-result-link" class="result-link" href="#">생성된 PDF 다운로드</a>
          </div>
        </section>

        <aside class="info-panel">
          <div class="info-block">
            <span class="info-label">ENGINE</span>
            <p><code>gotenberg</code> Chromium Markdown 변환 엔드포인트를 사용합니다.</p>
          </div>
          <div class="info-block">
            <span class="info-label">INPUT</span>
            <p><code>.md</code> 파일 업로드, 최대 40MB</p>
          </div>
          <div class="info-block">
            <span class="info-label">OUTPUT</span>
            <p>A4 기준의 스타일이 적용된 PDF를 바로 다운로드합니다.</p>
          </div>
        </aside>
      </main>
    </div>

    <script src="/app.js" defer></script>
  </body>
</html>
